<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>Christmas Wonder Shop</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&family=Playwrite+CU:wght@100..400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* NUOVO GRADIENTE */
            --gold-gradient: linear-gradient(90deg, rgba(197,149,65,1) 0%, rgba(253,236,163,1) 100%);
            
            /* Colori solidi estratti dal gradiente per fallback e bordi */
            --gold-dark: rgba(197,149,65,1);
            --gold-light: rgba(253,236,163,1);

            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --bg-gradient: radial-gradient(circle at center, #005c1f 0%, #002e08 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            height: 100%;
            background: var(--bg-gradient);
            overflow-x: hidden;
        }

        body {
            color: white;
            font-family: 'Josefin Sans', sans-serif;
            min-height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Effetto Neve Ottimizzato --- */
        .snow, .snow:before, .snow:after {
            position: fixed;
            top: -650px;
            left: 0;
            bottom: 0;
            right: 0;
            background-image: 
                radial-gradient(4px 4px at 100px 50px, #fff , transparent), 
                radial-gradient(6px 6px at 200px 150px, #fff, transparent), 
                radial-gradient(3px 3px at 300px 250px, #fff, transparent), 
                radial-gradient(4px 4px at 400px 350px, #fff, transparent), 
                radial-gradient(6px 6px at 500px 100px, #fff, transparent), 
                radial-gradient(3px 3px at 50px 200px, #fff, transparent), 
                radial-gradient(4px 4px at 150px 300px, #fff, transparent), 
                radial-gradient(6px 6px at 250px 400px, #fff, transparent), 
                radial-gradient(3px 3px at 350px 500px, #fff, transparent);
            background-size: 650px 650px;
            animation: snow 10s linear infinite;
            content: "";
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0); 
        }
        .snow:after { margin-left: -250px; opacity: 0.2; animation-duration: 15s; animation-direction: reverse; filter: blur(2px); }
        .snow:before { margin-left: -350px; opacity: 0.4; animation-duration: 20s; filter: blur(1px); }

        @keyframes snow {
            to { transform: translateY(650px); }
        }

        /* --- Container Principale Ottimizzato --- */
        .main-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 90%;
            max-width: 800px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease-out;
            margin: 40px 0;
            transform: translateZ(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-img {
            width: 180px;
            height: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
            transition: transform 0.3s ease;
            will-change: transform;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        h1 {
            font-weight: 700;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 2rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }

        /* --- Countdown Grid System --- */
        .countdown-wrapper {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 2.5rem;
            width: 100%;
        }

        .time-box {
            background: rgba(0, 30, 0, 0.4);
            /* Uso il colore chiaro del gradiente per il bordo trasparente */
            border: 1px solid rgba(253, 236, 163, 0.3);
            border-radius: 16px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, border-color 0.3s;
        }

        .time-box:hover {
            transform: translateY(-5px);
            /* Al passaggio del mouse diventa il colore chiaro solido */
            border-color: var(--gold-light);
        }

        .number {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            font-weight: 600;
            
            /* Applicazione Gradiente al Testo */
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent; /* Fallback */
            display: inline-block;
        }

        /* --- Footer & Social --- */
        .footer-text {
            font-family: 'Playwrite CU', cursive;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            margin-bottom: 1.5rem;
            color: #eee;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 2.5rem;
        }

        .social-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            text-decoration: none;
            color: white;
            font-size: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }

        .social-btn:hover {
            background: white;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .social-btn:hover .fa-facebook-f { color: #1877F2; }
        .social-btn:hover .fa-instagram { color: #E4405F; }
        .social-btn:hover .fa-tiktok { color: #000000; }
        .social-btn:hover .fa-whatsapp { color: #25D366; }
        .social-btn:hover .fa-youtube { color: #FF0000; }

        /* --- Messaggio Speciale --- */
        .christmas-message {
            display: none;
            font-family: 'Playwrite CU', cursive;
            font-size: clamp(2rem, 6vw, 3.5rem);
            
            /* Applicazione Gradiente */
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            animation: textGlow 2s infinite alternate;
            padding: 20px 0;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 10px rgba(253, 236, 163, 0.3); }
            to { text-shadow: 0 0 20px rgba(253, 236, 163, 0.8), 0 0 30px #ff0000; }
        }

        /* --- STILE CURIOSITA' (OTTIMIZZATO) --- */
        .facts-container {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .section-heading {
            font-family: 'Playwrite CU', cursive;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            
            /* Applicazione Gradiente */
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Icona dentro l'heading deve ereditare il background clip */
        .section-heading i {
            background: inherit;
            -webkit-background-clip: inherit;
            background-clip: inherit;
            -webkit-text-fill-color: inherit;
        }

        .fact-text {
            font-size: 1.1rem;
            font-style: italic;
            color: #f0f0f0;
            min-height: 120px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
            line-height: 1.6;
            transition: opacity 0.3s ease-in-out;
            will-change: opacity;
            width: 100%;
        }

        .gold-button {
            /* Applicazione Gradiente Sfondo */
            background: var(--gold-gradient);
            
            color: #002e08;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            
            /* Bordo con colore scuro del gradiente per contrasto */
            border: 2px solid var(--gold-dark);
            
            box-shadow: 0 4px 15px rgba(197, 149, 65, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .gold-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 149, 65, 0.7);
            filter: brightness(1.1);
        }

        .gold-button:active {
            transform: translateY(0);
        }

        /* --- Media Queries --- */
        @media (max-width: 600px) {
            .main-container {
                padding: 2rem 1rem;
                width: 95%;
                margin: 20px 0;
            }
            
            .countdown-wrapper {
                gap: 8px;
            }

            .time-box {
                border-radius: 12px;
                padding: 10px 2px;
            }
            
            .social-btn {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="snow"></div>

    <div class="main-container">
        <!-- Logo -->
        <img src="https://i.postimg.cc/6p5vdWTN/Progetto-senza-titolo-8.png" alt="Christmas Wonder Shop Logo" class="logo-img">
        
        <!-- Titolo Dinamico -->
        <h1 id="main-title">Caricamento...</h1>
        
        <!-- Messaggio Festivo -->
        <div id="end-message" class="christmas-message"></div>
        
        <!-- Countdown -->
        <div class="countdown-wrapper" id="countdown-container">
            <div class="time-box">
                <div id="days" class="number">00</div>
                <div class="label">Giorni</div>
            </div>
            <div class="time-box">
                <div id="hours" class="number">00</div>
                <div class="label">Ore</div>
            </div>
            <div class="time-box">
                <div id="minutes" class="number">00</div>
                <div class="label">Min</div>
            </div>
            <div class="time-box">
                <div id="seconds" class="number">00</div>
                <div class="label">Sec</div>
            </div>
        </div>
    
        <div class="footer-text">Continua a seguirci!</div>
    
        <!-- Icone Social con YouTube -->
        <div class="social-icons">
            <a href="https://www.facebook.com/ChristmasWonderShop.official/" target="_blank" class="social-btn" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/christmaswondershop/" target="_blank" class="social-btn" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@christmaswondershop" target="_blank" class="social-btn" aria-label="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a href="http://wa.me/390316870231" target="_blank" class="social-btn" aria-label="WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://www.youtube.com/@christmaswondershop" target="_blank" class="social-btn" aria-label="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </div>

        <!-- NUOVA SEZIONE: Curiosità Magiche -->
        <section id="fun-facts" class="facts-container">
            <h2 class="section-heading">
                <i class="fa-solid fa-star"></i>
                Curiosità Magiche
            </h2>
            <p id="current-fact" class="fact-text">
                Caricamento curiosità...
            </p>
            <button id="next-fact-btn" class="gold-button">
                <i class="fa-solid fa-wand-magic-sparkles" style="margin-right: 8px;"></i> Prossima Curiosità
            </button>
        </section>

    </div>

    <script>
        // --- LOGICA COUNTDOWN ---
        const titleElement = document.getElementById('main-title');
        const countdownContainer = document.getElementById('countdown-container');
        const endMessage = document.getElementById('end-message');
        const daysElement = document.getElementById('days');
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');

        const formatNumber = (num) => num < 10 ? '0' + num : num;

        const updateUI = (title, gap, msg, isCountdown = true) => {
            titleElement.innerText = title;
            endMessage.innerText = msg || '';

            if (isCountdown) {
                titleElement.style.display = 'block';
                countdownContainer.style.display = 'grid';
                endMessage.style.display = 'none';

                const second = 1000, minute = second * 60, hour = minute * 60, day = hour * 24;
                const d = Math.floor(gap / day);
                const h = Math.floor((gap % day) / hour);
                const m = Math.floor((gap % hour) / minute);
                const s = Math.floor((gap % minute) / second);

                daysElement.innerText = formatNumber(d);
                hoursElement.innerText = formatNumber(h);
                minutesElement.innerText = formatNumber(m);
                secondsElement.innerText = formatNumber(s);
            } else {
                titleElement.style.display = 'none';
                countdownContainer.style.display = 'none';
                endMessage.style.display = 'block';
            }
        }

        const countdown = () => {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            const christmasDate = new Date(`December 25, ${currentYear} 00:00:00`).getTime();
            const endOfChristmas = new Date(`December 26, ${currentYear} 23:59:59`).getTime();
            
            let returnDateYear = currentYear;
            if (now.getMonth() > 9) { returnDateYear = currentYear + 1; }
            const returnDate = new Date(`October 01, ${returnDateYear} 00:00:00`).getTime();

            const nowTime = now.getTime();

            if (nowTime >= christmasDate && nowTime <= endOfChristmas) {
                updateUI('', 0, 'BUON NATALE!', false);
            } else if (nowTime < returnDate && now.getMonth() < 9) {
                const gap = returnDate - nowTime;
                updateUI('Torniamo tra:', gap, null, true);
            } else if (nowTime > endOfChristmas) {
                const nextReturn = new Date(`October 01, ${currentYear + 1} 00:00:00`).getTime();
                const gap = nextReturn - nowTime;
                updateUI('Torniamo tra:', gap, null, true);
            } else {
                let targetXmas = christmasDate;
                if (nowTime > christmasDate) {
                    targetXmas = new Date(`December 25, ${currentYear + 1} 00:00:00`).getTime();
                }
                const gap = targetXmas - nowTime;
                updateUI('Natale è tra:', gap, null, true);
            }
        };

        setInterval(countdown, 1000);
        countdown();

        // --- LOGICA CURIOSITA' (OTTIMIZZATA PER IPAD/MOBILE) ---
        const funFacts = [
            "Sapevi che Babbo Natale è noto come 'Sinterklaas' nei Paesi Bassi?",
            "Il canto di Natale più registrato è 'Silent Night'.",
            "L'albero di Natale è stato decorato per la prima volta in Germania.",
            "Le renne di Babbo Natale sono 9, e Rudolph è la più famosa.",
            "Il periodo natalizio è in realtà di 12 giorni, che terminano con l'Epifania.",
            "Tradizionalmente, gli addobbi dorati e argentati simboleggiano la luna e il sole.",
            "Il primo presepe della storia fu realizzato da San Francesco d'Assisi nel 1223.",
            "In Islanda, i bambini ricevono visite da 13 diversi 'Folletti di Natale'.",
            "Le canzoni di Natale venivano cantate originariamente in tutte le stagioni.",
            "In Giappone, è tradizione cenare da KFC per il giorno di Natale!",
            "La statua della Libertà è stata tecnicamente il più grande regalo di Natale della storia.",
            "I bastoncini di zucchero rossi e bianchi furono inventati per tenere i bambini tranquilli in chiesa.",
            "Jingle Bells fu originariamente scritta per la festa del Ringraziamento, non per il Natale.",
            "In Polonia, i ragni sono considerati simboli di fortuna natalizia e si trovano spesso sugli alberi.",
            "Gli astronauti a bordo della Gemini 6 fecero il primo scherzo spaziale suonando Jingle Bells nel 1965.",
            "L'albero di Natale del Rockefeller Center a New York è illuminato da oltre 50.000 luci LED.",
            "In Svezia, quasi tutta la nazione guarda i cartoni di Paperino il pomeriggio della vigilia di Natale."
        ];

        let currentFactIndex = 0;
        let isAnimating = false; // Flag per prevenire click rapidi che causano glitch
        const currentFactElement = document.getElementById('current-fact');
        const nextFactButton = document.getElementById('next-fact-btn');

        const showNextFact = () => {
            // Se stiamo già animando, ignoriamo il click
            if (isAnimating) return;
            
            isAnimating = true;
            currentFactElement.style.opacity = 0;
            
            setTimeout(() => {
                // Aggiorniamo il testo solo quando è invisibile
                if (currentFactIndex >= funFacts.length) {
                    currentFactIndex = 0;
                }
                currentFactElement.innerText = funFacts[currentFactIndex];
                currentFactIndex++;
                
                // Piccola pausa per assicurare che il rendering sia pulito su iOS
                requestAnimationFrame(() => {
                    currentFactElement.style.opacity = 1;
                    // Sblocchiamo il pulsante solo alla fine dell'animazione
                    setTimeout(() => {
                        isAnimating = false;
                    }, 300);
                });
            }, 300); // Deve coincidere con transition del CSS
        };

        nextFactButton.addEventListener('click', showNextFact);
        
        // Avvio curiosità iniziale
        currentFactElement.innerText = funFacts[0];
        currentFactIndex = 1;
    </script>

</body>
</html>
