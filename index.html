<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Wonder Shop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300..700;1,300..700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playwrite+CU:wght@100..400&display=swap');

        /* Resetta margini e padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Sfondo a gradiente radiale per profondità */
            background: radial-gradient(circle at center, #00a81f 0%, #004d08 100%);
            color: white;
            font-family: 'Josefin Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Assicura che copra l'altezza anche su mobile */
            flex-direction: column;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Aggiunta di un sottile pattern "neve" sullo sfondo */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 5px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            z-index: -1;
            opacity: 0.2;
            pointer-events: none;
        }

        /* Contenitore principale effetto "Vetro" (Glassmorphism) */
        .main-container {
            background: rgba(255, 255, 255, 0.1); /* Bianco semi-trasparente */
            backdrop-filter: blur(10px); /* Sfocatura dello sfondo sottostante */
            -webkit-backdrop-filter: blur(10px); /* Per Safari */
            border-radius: 25px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            max-width: 220px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5), 0 0 15px rgba(255, 215, 0, 0.3);
            letter-spacing: 1px;
        }

        /* Nuovo stile per il messaggio di auguri finale */
        .christmas-message {
            display: none; /* Nascosto di default */
            font-family: 'Playwrite CU', sans-serif;
            font-size: 4rem;
            color: #ffd700; /* Oro */
            text-shadow: 0 0 20px rgba(255, 42, 42, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 42, 42, 1), 0 0 10px rgba(255, 215, 0, 0.8); }
        }

        /* Contenitore del countdown */
        .countdown-wrapper {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Permette di andare a capo su schermi piccoli */
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
        }

        /* Le singole scatole del tempo (giorni, ore...) */
        .time-box {
            background: rgba(0, 60, 10, 0.6); /* Verde scuro semi-trasparente */
            border: 2px solid #ffd700; /* Bordo dorato */
            border-radius: 15px;
            padding: 15px 10px;
            min-width: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2) inset, 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-3px);
        }

        .number {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .label {
            font-size: 1.1rem;
            color: #ffd700; /* Testo dorato per le etichette */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: 600;
        }

        .footer {
            font-family: 'Playwrite CU', sans-serif;
            font-size: 1.8rem;
            margin-top: 20px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            margin-top: 35px;
            gap: 20px;
            background: rgba(0,0,0,0.2);
            padding: 15px 25px;
            border-radius: 50px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .social-icons img {
            width: 32px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        .social-icons .whatsapp img {
            width: 28px;
        }

        /* Effetto hover sulle icone social */
        .social-icons a:hover {
            transform: scale(1.2) rotate(5deg);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }

        /* Media query per schermi piccoli */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .time-box { min-width: 90px; padding: 10px 5px; }
            .number { font-size: 2.5rem; }
            .label { font-size: 0.9rem; }
            .christmas-message { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <img src="https://i.postimg.cc/6p5vdWTN/Progetto-senza-titolo-8.png" alt="Logo" class="logo-img">
        
        <h1 id="main-title">Natale è tra:</h1>
        
        <div id="end-message" class="christmas-message">
            BUON NATALE!
        </div>
        
        <div class="countdown-wrapper" id="countdown-container">
            <div class="time-box">
                <div id="days" class="number">00</div>
                <div class="label">giorni</div>
            </div>
            <div class="time-box">
                <div id="hours" class="number">00</div>
                <div class="label">ore</div>
            </div>
            <div class="time-box">
                <div id="minutes" class="number">00</div>
                <div class="label">minuti</div>
            </div>
            <div class="time-box">
                <div id="seconds" class="number">00</div>
                <div class="label">secondi</div>
            </div>
        </div>
    
        <div class="footer">
            Continua a seguirci!
        </div>
    
        <div class="social-icons">
            <a href="https://www.facebook.com/ChristmasWonderShop.official/">
                <img src="https://i.postimg.cc/25fsrVdg/icons8-facebook-nuovo-30.png" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/christmaswondershop/">
                <img src="https://i.postimg.cc/KvCXp91G/icons8-instagram-30.png" alt="Instagram">
            </a>
            <a href="https://www.tiktok.com/@christmaswondershop">
                <img src="https://i.postimg.cc/DwG99qGq/icons8-tic-toc-30.png" alt="TikTok">
            </a>
            <a href="http://wa.me/390316870231" target="_blank" class="whatsapp">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/whatsapp-white-icon.png" alt="WhatsApp">
            </a>
        </div>
    </div>

    <script>
        const countdown = () => {
            // Imposta la data al 25 Dicembre 2025
            const countDate = new Date('December 25, 2025 00:00:00').getTime(); 
            const now = new Date().getTime();
            const gap = countDate - now;

            // Logica per quando il countdown scade
            if (gap <= 0) {
                // Nascondi il titolo iniziale e il contatore
                document.getElementById('main-title').style.display = 'none';
                document.getElementById('countdown-container').style.display = 'none';
                
                // Mostra il messaggio finale
                document.getElementById('end-message').style.display = 'block';
                return; 
            }

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const days = Math.floor(gap / day);
            const hours = Math.floor((gap % day) / hour);
            const minutes = Math.floor((gap % hour) / minute);
            const seconds = Math.floor((gap % minute) / second);

            // Aggiunge uno zero davanti se il numero è minore di 10 (es. 05 invece di 5)
            document.getElementById('days').innerText = days < 10 ? '0' + days : days;
            document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
        };

        countdown();
        setInterval(countdown, 1000);
    </script>

</body>
</html>
